# FARIA — Hermes runtime (RF-01: connectivity only)
#
# Scope: Hermes Gateway <-> 9Router <-> model, plus the Telegram gateway.
# Household MCP, SQLite business schema, and the FARIA dashboard app are NOT
# part of this file — see AGENTS.md "Do Not Implement Yet" for RF-01.
#
# --- Discovered runtime blocker (see scripts/runtime/README.md) ------------
# No publicly published Hermes Agent Docker image exists as of this writing
# (verified against https://github.com/NousResearch/hermes-agent and
# https://hermes-agent.nousresearch.com/docs, 2026-09-11). You must build one
# locally from the upstream source before this file works:
#
#   git clone https://github.com/NousResearch/hermes-agent <a directory OUTSIDE this repo>
#   cd <that clone>
#   docker build -t hermes-agent:local .
#
# Then set HERMES_IMAGE=hermes-agent:local in your local .env (see
# .env.example) — or override it if you tag/pull the image differently.
#
# --- Deliberate deviations from upstream hermes-agent/docker-compose.yml ---
# 1. No `network_mode: host`. Upstream uses host networking, which is
#    unreliable on Docker Desktop for Windows/macOS (this repo's common dev
#    environment). Instead this file uses default bridge networking plus
#    `host.docker.internal`, so the container can reach a 9Router instance
#    running on the developer host without the container's own "localhost"
#    being misread as the container itself (see SYSTEM_ARCHITECTURE.md,
#    Deployment Architecture).
# 2. The built-in `dashboard` service is omitted entirely. Hermes' own
#    dashboard/API server must stay opt-in, not something `docker compose up`
#    starts by default (see docs/05_operations/CONFIGURATION.md).
#
# Persistent Hermes state (config.yaml, credential cache, session data) lives
# in the named volume `hermes_data`, mounted at /opt/data — the same path
# Hermes expects on its host convention (~/.hermes -> /opt/data).
#
# Run from the repository root so relative paths and --env-file resolve
# predictably:
#   docker compose -f infra/docker/compose.yaml --env-file .env up -d gateway
#   docker compose -f infra/docker/compose.yaml --env-file .env config   (validate only)

services:
  gateway:
    image: ${HERMES_IMAGE:-hermes-agent:local}
    container_name: faria-hermes-gateway
    restart: unless-stopped
    volumes:
      - hermes_data:/opt/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ROUTER9_BASE_URL=${ROUTER9_BASE_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      # Built-in API server stays OFF. Do not uncomment without reviewing
      # docs/05_operations/CONFIGURATION.md and SYSTEM_ARCHITECTURE.md first:
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
    extra_hosts:
      # Docker Desktop (Windows/macOS) already provides host.docker.internal;
      # this makes the same hostname resolve on Linux hosts too.
      - "host.docker.internal:host-gateway"
    command: ["gateway", "run"]
    # No published ports: for RF-01, both the Telegram connection and the
    # call to 9Router are outbound-only from this container. Nothing needs
    # to accept inbound connections.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  hermes_data:
