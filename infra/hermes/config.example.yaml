# FARIA — Hermes config.yaml example (RF-01: runtime foundation only)
#
# Copy this file into the Hermes data location as `config.yaml` and replace
# every ${VAR} with a real environment variable in your local .env (never
# paste literal secret values into this file or into a committed copy).
#
# Host convention: ~/.hermes/config.yaml (Linux/macOS/WSL2) or
# %LOCALAPPDATA%\hermes\config.yaml (Windows native). Inside the FARIA Docker
# Compose setup (infra/docker/compose.yaml) this maps to /opt/data/config.yaml
# via the `hermes_data` named volume.
#
# Verified against https://hermes-agent.nousresearch.com/docs/user-guide/configuration
# and https://hermes-agent.nousresearch.com/docs/user-guide/security (checked 2026-09-11).
# Do NOT introduce legacy `LLM_MODEL`-style configuration — current Hermes
# uses the providers/model schema below instead (see AGENTS.md guardrails).

# ---------------------------------------------------------------------------
# Model / provider selection
# ---------------------------------------------------------------------------
# Hermes must reach the model ONLY through 9Router, never directly against
# OpenRouter/upstream (SYSTEM_ARCHITECTURE.md INV / API Architecture). 9Router
# is registered here as a custom OpenAI-compatible provider — current Hermes
# docs state a custom endpoint "uses OPENAI_API_KEY for auth" regardless of
# which upstream service actually sits behind it.
providers:
  router9:
    base_url: ${ROUTER9_BASE_URL}   # e.g. http://host.docker.internal:20128/v1 — see .env.example
    api_key: ${OPENAI_API_KEY}      # 9Router's own key/credential, NOT an OpenRouter key
    models:
      household-main:               # logical FARIA model alias (Product Brief §9 / SYSTEM_ARCHITECTURE.md)
        timeout_seconds: 60

# `household-main` is FARIA's *intended* logical alias. It only resolves if
# your actual 9Router instance is configured to expose a model with this
# exact name. If it is not (yet), temporarily point `model:` below at
# whatever identifier your running 9Router instance actually exposes, and
# record that substitution as a local runtime implementation detail — not a
# product/architecture decision (see SYSTEM_ARCHITECTURE.md, AQ-02).
model: router9/household-main

# ---------------------------------------------------------------------------
# Approvals — safety gate for any tool/terminal action
# ---------------------------------------------------------------------------
# RF-01 does not grant FARIA household users arbitrary shell access, and
# current Hermes documentation does not expose a config key that fully
# disables the terminal/shell tool (verified 2026-09-11 — see
# docs/05_operations/CONFIGURATION.md, "Known Runtime Limitation"). "manual"
# is the strictest documented mode: every potentially dangerous tool/command
# requires explicit human approval instead of being auto-approved.
approvals:
  mode: manual

# Isolate any tool/command execution that does occur away from the host.
terminal:
  backend: docker

# ---------------------------------------------------------------------------
# Network safety
# ---------------------------------------------------------------------------
# Baseline SSRF protection: prevent web/browser tools from reaching internal
# or cloud-metadata endpoints.
security:
  website_blocklist:
    enabled: true
    domains: []   # add household-specific internal hosts here if any exist later

# ---------------------------------------------------------------------------
# API server / built-in dashboard
# ---------------------------------------------------------------------------
# Left OFF for RF-01. FARIA's own dashboard application is a later batch, and
# Hermes' built-in OpenAI-compatible API server/dashboard must not become an
# unreviewed public surface. Do not set API_SERVER_HOST/API_SERVER_KEY
# unless you have a specific, reviewed reason — see infra/docker/compose.yaml
# and docs/05_operations/CONFIGURATION.md before changing this.
