[project]
name = "faria-household-mcp"
version = "0.1.0"
description = "Constrained FARIA household-domain MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0,<3",
]

[project.scripts]
faria-household-mcp = "faria_household_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faria_household_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "faria_household_mcp/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
